name: Published freshness watchdog

on:
  schedule:
    # 09:30 Asia/Taipei. GitHub scheduled jobs may start later under load.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-published-day:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require current Taipei health on live Pages
        run: >-
          python bin/check_published_freshness.py
          --health-url https://hsintiger.github.io/skills-radar/pipeline_health.json
